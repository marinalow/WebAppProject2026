<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 Apples Orchard</title>
<style>
:root{--leaf:#286b3b;--cream:#fffaf0;--pink:#f7d7d0;--red:#e74742;--dark:#283d2b}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(180deg,#e9f8df,#fffaf0 55%,#fce6d5);color:var(--dark);min-height:100vh}
header{text-align:center;padding:34px 16px 18px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 8px;color:#2f733c;letter-spacing:-1px}.sub{margin:0;color:#58745a;font-size:1.05rem}
.panel{max-width:1100px;margin:0 auto;padding:0 18px 36px}.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.counter{background:white;border:2px solid #d7e8cb;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 5px 12px #4b6b3820}.counter strong{color:#df3938;font-size:1.15em}.btn{border:0;border-radius:999px;padding:11px 18px;background:#347b42;color:white;font-weight:750;cursor:pointer;box-shadow:0 4px 0 #205a2c;transition:transform .12s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #205a2c}.btn.secondary{background:#fff;color:#347b42;border:2px solid #cfe2c4;box-shadow:none}
.orchard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(8px,2vw,18px);background:#ffffffa8;border:2px solid #d8eacb;border-radius:28px;padding:clamp(12px,3vw,28px);box-shadow:0 14px 35px #52774618}
.apple{appearance:none;border:0;background:transparent;cursor:pointer;border-radius:18px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;transition:transform .15s,background .15s;position:relative}.apple:hover{transform:translateY(-4px) rotate(-2deg);background:#fff8}.apple:focus-visible{outline:3px solid #357d42;outline-offset:2px}.apple svg{width:100%;max-width:92px;filter:drop-shadow(0 5px 3px #573b291c);transition:filter .15s,opacity .15s}.apple .num{font-size:.78rem;color:#75906b;font-weight:700}.apple.picked svg{opacity:.25;filter:grayscale(1);transform:scale(.86)}.apple.picked:after{content:'✓';position:absolute;top:25%;font-size:clamp(1.2rem,3vw,2rem);font-weight:900;color:#2f793e;background:white;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:0 2px 8px #0002}.apple.picked .num{text-decoration:line-through;color:#a2ad9a}.message{text-align:center;min-height:30px;margin:18px 0 0;font-weight:700;color:#477449}.footer{text-align:center;color:#82957b;font-size:.85rem;margin-top:16px}@media(max-width:560px){.orchard{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:10px}.apple .num{font-size:.7rem}header{padding-top:25px}}
</style></head><body><header><h1>🍎 67 Apples 🍎</h1><p class="sub">A little orchard full of apples — click any apple to pick it!</p></header><main class="panel"><div class="toolbar"><div class="counter">Picked: <strong id="picked">0</strong> / 67</div><div class="counter">Left on tree: <strong id="left">67</strong></div><button class="btn secondary" id="reset">Reset orchard</button><button class="btn" id="pickall">Pick all apples</button></div><section class="orchard" id="orchard" aria-label="67 clickable apples"></section><p class="message" id="message" aria-live="polite">Your orchard is ready. Choose an apple!</p><p class="footer">Made for apple pickers everywhere ✨</p></main>
<script>
const orchard=document.getElementById('orchard');let picked=new Set();
function appleSVG(i){const shades=['#e9433d','#f04b42','#d93435','#f35c4d','#c92e32'];const red=shades[(i*7+i%3)%shades.length];const shine=i%2===0?'<ellipse cx="31" cy="43" rx="5" ry="10" fill="#fff" opacity=".45" transform="rotate(20 31 43)"/>':'';return `<svg viewBox="0 0 80 90" role="img" aria-label="Apple ${i}"><path d="M41 27 C37 14 44 8 54 7 C53 17 48 24 41 27" fill="#39864a"/><path d="M40 29 C39 19 40 14 44 10" stroke="#76502e" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M40 27 C29 20 20 26 15 35 C6 51 17 77 30 81 C36 83 39 79 43 79 C49 79 52 84 59 79 C73 70 78 48 67 34 C61 26 51 22 40 27Z" fill="${red}" stroke="#b72b2c" stroke-width="2"/>${shine}<path d="M20 56 Q20 69 29 74" stroke="#ffb0a0" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></svg>`}
for(let i=1;i<=67;i++){const b=document.createElement('button');b.className='apple';b.type='button';b.setAttribute('aria-label',`Pick apple ${i}`);b.innerHTML=appleSVG(i)+`<span class="num">${i}</span>`;b.addEventListener('click',()=>toggle(i,b));orchard.appendChild(b)}
function update(){document.getElementById('picked').textContent=picked.size;document.getElementById('left').textContent=67-picked.size;document.getElementById('message').textContent=picked.size===67?'Amazing! You picked all 67 apples! 🍎🎉':picked.size===0?'Your orchard is ready. Choose an apple!':`Lovely picking! ${picked.size} apple${picked.size===1?'':'s'} picked so far.`}
function toggle(i,b){if(picked.has(i)){picked.delete(i);b.classList.remove('picked');b.setAttribute('aria-label',`Pick apple ${i}`)}else{picked.add(i);b.classList.add('picked');b.setAttribute('aria-label',`Apple ${i}, picked`)}update()}
document.getElementById('reset').addEventListener('click',()=>{picked.clear();document.querySelectorAll('.apple').forEach((b,i)=>{b.classList.remove('picked');b.setAttribute('aria-label',`Pick apple ${i+1}`)});update()});document.getElementById('pickall').addEventListener('click',()=>{picked=new Set(Array.from({length:67},(_,i)=>i+1));document.querySelectorAll('.apple').forEach((b,i)=>{b.classList.add('picked');b.setAttribute('aria-label',`Apple ${i+1}, picked`)});update()});
</script></body></html>
